# Keeps the free Supabase project awake: Supabase pauses free projects
# after about a week without activity, which breaks sign-in on the site.
# Reads the public site settings every 2 days (public key only, read-only).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://gtmzayvorvajufhcpxjk.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_1t6w_YnKEylif06X2wAcbw_CBdwu9PM
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/site_content?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase answered HTTP $code"
          test "$code" = "200"
