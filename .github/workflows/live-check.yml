# Read-only health and security check of the live site (run on demand or weekly).
name: Live site check

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/live-check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
